<form class="brief-form page-brief-form">
    <div class="form-row">
        <label>Your name<input name="name" autocomplete="name" placeholder="Name" required maxlength="100">
        </label><label>Email address<input type="email" name="email" autocomplete="email" placeholder="you@company.com"
                required maxlength="200"></label>
    </div><label>What are you
        thinking?<select name="type" required>
            <option value="" disabled selected>Choose a direction</option>
            <option>Film production</option>
            <option>Photography</option>
            <option>Creative direction</option>
            <option>A bit of everything</option>
        </select></label><label>A little about the idea<textarea name="idea" rows="3"
            placeholder="The project, the mood, the what-if…" required minlength="10"
            maxlength="3000"></textarea></label><button class="submit-brief" type="submit">Create project brief <span
            aria-hidden="true">↗</span></button>
    <p class="form-privacy">Your details stay in this browser. No message is sent.</p>
    <p class="form-result" role="status" hidden></p>
</form>
